<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Connecting Lines -->
  <g stroke="url(#treeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Child to Parents -->
    <line x1="16" y1="26" x2="9" y2="16" />
    <line x1="16" y1="26" x2="23" y2="16" />
    <!-- Parents to Grandparents -->
    <line x1="9" y1="16" x2="4" y2="7" />
    <line x1="9" y1="16" x2="13" y2="7" />
    <line x1="23" y1="16" x2="19" y2="7" />
    <line x1="23" y1="16" x2="28" y2="7" />
  </g>

  <!-- Nodes (Circles) -->
  <g fill="url(#treeGrad)">
    <!-- Child (Root) -->
    <circle cx="16" cy="26" r="3.5" stroke="#FFFFFF" stroke-width="0.75" />

    <!-- Parents -->
    <circle cx="9" cy="16" r="3" stroke="#FFFFFF" stroke-width="0.75" />
    <circle cx="23" cy="16" r="3" stroke="#FFFFFF" stroke-width="0.75" />

    <!-- Grandparents -->
    <circle cx="4" cy="7" r="2.5" stroke="#FFFFFF" stroke-width="0.75" />
    <circle cx="13" cy="7" r="2.5" stroke="#FFFFFF" stroke-width="0.75" />
    <circle cx="19" cy="7" r="2.5" stroke="#FFFFFF" stroke-width="0.75" />
    <circle cx="28" cy="7" r="2.5" stroke="#FFFFFF" stroke-width="0.75" />
  </g>
</svg>
